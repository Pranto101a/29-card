const RL=[['start','SET TRUMP TO START','ট্রাম্প সেট করা প্লেয়ারই প্রথম চাল দেবে'],['full','FULL BOARD','সব হাত জিতলে +১ বোনাস স্কোর'],['jacks','ALL 4 JACKS','কারও হাতে চারটা J এলে নতুন ডিল'],['pair','MARRIAGE / ROYALS / PAIR','ট্রাম্প সেট করা দল K+Q দেখালে টার্গেট −৪ (সর্বনিম্ন ১৬), অন্য দল দেখালে +৪ (সর্বোচ্চ ২৮)'],['joker','JOKER TRUMP','Joker ট্রাম্প বাছলে কোনো ট্রাম্প রং থাকে না'],['first3','FIRST 3 PASSED','প্রথম তিনজন Pass করলে বোর্ড বাতিল (বন্ধ থাকলে চতুর্থজনকে ১৬ ডাকতে হবে)'],['seven',"7'TH CARD POINT",'৭ম কার্ড ট্রাম্প সেটারের হাতে ট্রাম্পের কোনো পয়েন্ট কার্ড না থাকলে বোর্ড বাতিল করা যাবে'],['anim','CARD ANIMATION','কার্ড খেলা ও হাত তোলার অ্যানিমেশন'],['last','LAST HAND POINT','শেষ হাত জেতা দল ১ অতিরিক্ত পয়েন্ট পাবে'],['half','UNDER HALF MINUS','ডাকা দল টার্গেটের অর্ধেকও না পেলে আরও −১ স্কোর'],['rev','REVERSE TRUMP','Reverse ট্রাম্প বাছলে ট্রাম্প দেখানোর পর ৭ সবচেয়ে বড়, J সবচেয়ে ছোট'],['reveal','TRUMP REVEAL','সব কার্ড খেলা শেষের আগে ট্রাম্প না দেখালে বোর্ড বাতিল'],['one','ONE CALL','প্রত্যেকে মাত্র একবার ডাকতে পারবে; কেউ বেশি ডাকলে আগের জন আর জবাব দিতে পারবে না']];
function rulesPg(b){if(b)RB=b;const y=($('.rl')||{}).scrollTop||0;$('#app').innerHTML=`<div class="menu rp"><h3>Play the game your way</h3><div class="rl">${RL.map(([k,t,d])=>`<div class="ri"><div><b>${t}</b><br>${d}</div><button class="sw ${RU[k]?'on':''}" onclick="RU['${k}']^=1;sv2();rulesPg()">${RU[k]?'ON':'OFF'}</button></div>`).join('')}</div><p class="note">নিয়ম বদল পরের ডিল থেকে কার্যকর হবে।</p><div class="br2" style="z-index:1"><button class="ib" onclick="${RB}">«</button><button class="bt" onclick="RU=Object.assign({},RU0);sv2();rulesPg()">Reset</button></div></div>`;$('.rl').scrollTop=y}
/* ---------- deal & bidding ---------- */
function newDeal(){let d;do{d=sh([...Array(32).keys()])}while(RU.jacks&&[0,1,2,3].some(s=>d.slice(s*4,s*4+4).concat(d.slice(16+s*4,20+s*4)).filter(c=>(c&7)==0).length==4));D=null;LH=0;G.dealer=((G.dealer||0)+1)%4;G.hands=[0,1,2,3].map(s=>d.slice(s*4,s*4+4).sort(srt));G.rest=[0,1,2,3].map(s=>d.slice(16+s*4,20+s*4));
Object.assign(G,{dbl:0,dby:-1,chg:-1,sw:-1,done:[0,0,0,0],rv:0,cancel:0,note:'',ph:'bid',bids:[0,0,0,0],pass:[0,0,0,0],high:0,bidder:-1,turn:(G.dealer+1)%4,trump:-1,type:'',shown:0,target:0,trick:[],cnt:[0,0],pts:[0,0],last:null,pair:0,n:0,asked:-1,fresh:-1});snd('shuffle');setTimeout(()=>snd('deal'),900);step()}
const forced=s=>!RU.first3&&!G.high&&G.pass.reduce((a,b)=>a+b)==3&&!G.pass[s];
function doBid(s,v){if(!v&&forced(s))v=16;if(v){G.bids[s]=v;G.high=v;G.bidder=s;if(RU.one)G.done[s]=1;snd('click')}else{G.pass[s]=1;G.bids[s]=-1;snd('pass')}
const np=[0,1,2,3].filter(x=>!G.pass[x]);
const act=[0,1,2,3].filter(x=>!G.pass[x]&&!G.done[x]&&x!=G.bidder),p3=!G.high&&G.pass.reduce((a,b)=>a+b)==3;
if(!np.length||(p3&&RU.first3)){G.ph='nodeal'}else if(G.high&&!act.length){G.ph='trump';G.turn=G.bidder;TS=0}else{for(let k=1;k<4;k++){const t=(s+k)%4;if(!G.pass[t]&&!G.done[t]&&t!=G.bidder){G.turn=t;break}}}step()}
function botBid(s){const h=G.hands[s],ct=[0,0,0,0];h.forEach(c=>ct[c>>3]++);let e=14+h.reduce((a,c)=>a+PT[c&7],0)+(Math.max(...ct)>=3?2:0)+(Math.random()*2|0);if(G.bidder>=0&&G.bidder%2==s%2)e--;const v=Math.max(16,G.high+1);return v<=Math.min(e,28)||forced(s)?v:0}
function botTrump(){const h=G.hands[G.bidder];let b=0,bv=-1;for(let s=0;s<4;s++){const v=h.filter(c=>c>>3==s).reduce((a,c)=>a+PT[c&7]+1.5,0);if(v>bv){bv=v;b=s}}setTrump('hand',b)}
function setTrump(k,su){const b=G.bidder;if(k=='7th')su=G.hands[b].concat(G.rest[b])[6]>>3;
G.hands=G.hands.map((h,s)=>h.concat(G.rest[s]).sort(srt));G.type=k;G.rv=k=='rev'?1:0;G.trump=k=='joker'||k=='rev'?-1:su;G.target=G.high;const op=[0,1,2,3].filter(x=>x%2!=b%2&&!G.hum[x]);if(op.length&&G.high>=21&&Math.random()<.2){G.dbl=1;G.dby=op[0]}G.ph='ann';snd('deal');step()}
function chooseTrump(){setTrump(TS==4?'7th':TS==5?'joker':TS==6?'rev':'hand',TS)}
function dbl(){G.dbl=1;G.dby=V;snd('pair');toast(NM[V]+' Doubled!');startPlay()}
function startPlay(){D=null;G.ph='play';G.turn=RU.start?G.bidder:(G.dealer+1)%4;G.trick=[];step()}
/* ---------- play ---------- */
const q=c=>G.rv&&G.shown?(c&7)-7:-(c&7),val=(c,t,L)=>t?100+q(c):(c>>3==L?50+q(c):0),tf=c=>G.shown&&G.trump>=0&&c>>3==G.trump?1:0;
function legal(s){const h=G.hands[s];if(!G.trick.length)return h.slice();const L=G.trick[0].c>>3,f=h.filter(c=>c>>3==L);if(f.length)return f;if(G.asked==s){const t=h.filter(c=>c>>3==G.trump);if(t.length)return t}return h.slice()}
const canAsk=s=>G.trick.length&&!G.shown&&(G.trump>=0||G.rv)&&!G.hands[s].some(c=>c>>3==G.trick[0].c>>3);
function ask(s){G.shown=1;G.asked=s;toast(NM[s]+' ট্রাম্প দেখতে চেয়েছে');snd('pair');step()}
function play(s,c){let t=tf(c);if(!t&&G.trump>=0&&c>>3==G.trump&&!G.trick.length&&s==G.bidder){G.shown=1;t=1;toast('ট্রাম্প দেখানো হলো: '+SU[G.trump])}
const h=G.hands[s];h.splice(h.indexOf(c),1);G.trick.push({s,c,t});G.fresh=c;
const r=c&7;if(RU.pair&&t&&!G.pair&&(r==4||r==5)&&h.includes((G.trump<<3)+(r==4?5:4))){G.pair=1;const own=s%2==G.bidder%2;G.target=own?Math.max(16,G.target-4):Math.min(28,G.target+4);toast(`জোড়া (K+Q)! ${own?'টার্গেট −৪':'টার্গেট +৪'} = ${G.target}`);snd('pair')}else snd('play');
G.turn=G.trick.length==4?-1:(s+1)%4;step()}
function cur(){const L=G.trick[0].c>>3;return G.trick.reduce((b,x)=>val(x.c,x.t,L)>val(b.c,b.t,L)?x:b)}
function botPlay(s){if(canAsk(s)&&G.asked!=s&&cur().s%2!=s%2&&(G.trick.some(x=>PT[x.c&7])||Math.random()<.5))return ask(s);
let lg=legal(s).sort((a,b)=>(a&7)-(b&7)),c;
if(!G.trick.length){const nt=lg.filter(x=>G.shown||s!=G.bidder||x>>3!=G.trump);if(nt.length)lg=nt;c=Math.random()<.7?lg[0]:lg[lg.length-1]}
else{const w=cur(),L=G.trick[0].c>>3,mate=w.s%2==s%2;
if(mate){const strong=(w.c&7)<=1;c=strong?lg.slice().sort((a,b)=>PT[b&7]-PT[a&7])[0]:lg[lg.length-1]}
else{const bt=lg.filter(x=>val(x,tf(x),L)>val(w.c,w.t,L));c=bt.length?bt[bt.length-1]:lg.slice().sort((a,b)=>PT[a&7]-PT[b&7]||(b&7)-(a&7))[0]}}
play(s,c)}
function ready(){V=G.pt;G.pt=null;G.V=V;snd('turn');render()}
function tap(c){if(G.ph!='play'||G.turn!=V||D)return;if(!legal(V).includes(c)){const L=G.trick[0].c>>3;snd('err');D=dl(G.asked==V&&G.hands[V].every(x=>x>>3!=L)?`Wrong Move<br>Please play a Trump`:`Wrong Move<br>Please play a ${SB[L]}`,[['OK','cd()']]);return render()}play(V,c)}
function endTrick(){clearTimeout(T);if(G.trick.length<4||G.sw>=0)return;const w=cur().s;if(!RU.anim)return endTrick2(w);G.sw=w;snd('sweep');render();T=setTimeout(()=>endTrick2(w),520)}
function endTrick2(w){G.sw=-1;let p=G.trick.reduce((a,x)=>a+PT[x.c&7],0);G.n++;if(G.n==8&&RU.last)p++;G.pts[w%2]+=p;G.cnt[w%2]++;G.last={t:G.trick,w};G.trick=[];G.asked=-1;G.turn=w;snd('trick');
if(G.n==8)return finish();step()}
function finish(){const bt=G.bidder%2,ok=G.pts[bt]>=G.target;let d=ok?1:-1,nt='';
if(RU.reveal&&!G.shown&&(G.trump>=0||G.rv)){d=0;G.cancel=1;nt='ট্রাম্প দেখানো হয়নি — বোর্ড বাতিল'}else{if(RU.full&&G.cnt[bt]==8){d++;nt='ফুল বোর্ড +১'}if(RU.full&&G.cnt[1-bt]==8){d--;nt='ফুল বোর্ড −১'}if(RU.half&&!ok&&G.pts[bt]<Math.ceil(G.target/2)){d--;nt+=' · অর্ধেকের কম −১'}}
if(G.dbl)d*=2;if(d)nt+=G.dbl?' · Double ×২':'';G.chg=bt;sc[bt]+=d;G.ph='over';G.ok=ok;G.note=nt;const we=bt==V%2?ok:!ok;if(!G.cancel)snd(we?'win':'lose');step()}
/* ---------- steps ---------- */
function step(){clearTimeout(T);const g=G,nh=g.hum.filter(x=>x).length,act=g.ph=='bid'||g.ph=='play'&&g.trick.length<4?g.turn:g.ph=='trump'||g.ph=='ann'?g.bidder:-1;if(act>=0&&g.hum[act]&&V!=act){if(nh>1)g.pt=act;else V=act}g.V=V;render();save();const d=()=>SET.sp*(.8+Math.random()*.6);
if(g.ph=='bid'){if(!g.hum[g.turn])T=setTimeout(()=>doBid(g.turn,botBid(g.turn)),d());else snd('turn')}
else if(g.ph=='trump'){if(!g.hum[g.bidder])T=setTimeout(botTrump,d())}
else if(g.ph=='play'){if(g.sw>=0){}else if(g.trick.length==4)T=setTimeout(endTrick,SET.sp*1.6+700);else if(!g.hum[g.turn])T=setTimeout(()=>botPlay(g.turn),d());else snd('turn')}}
/* ---------- render ---------- */
function render(){const g=G;if(!g||!g.hands)return;const pl=g.ph=='play',me=g.turn==V&&(g.ph=='bid'||pl&&g.trick.length<4);
let h=`<div class="top"><button class="ib" onclick="menu()">«</button><button class="ib" onclick="sets()">⚙</button><button class="ib" onclick="D=dl('ম্যাচ নতুন করে শুরু করবেন?',[['Yes','newGame(G.hum,G.names)'],['No','cd()']]);render()">↺</button><span style="flex:1"></span><button class="ib" onclick="D=dl(RULES,[['OK','cd()']],'l');render()">📖</button><button class="ib" onclick="D=dl('নতুন ডিল দেবেন?',[['Yes','newDeal()'],['No','cd()']]);render()">⟳</button><button class="ib" style="${MI?'background:#6a7a10':''}" onclick="music();render()">🎵</button><button class="ib" onclick="SET.snd^=1;sv();render()">${SET.snd?'🔊':'🔇'}</button></div>`;
if(g.bidder>=0&&g.ph!='bid')h+=`<div class="inf" style="left:10px">Trump Player<br>${NM[g.bidder]} - ${g.target}</div>`;
if(pl||g.ph=='over')h+=`<div class="inf" style="right:10px;text-align:right">Our Point: ${g.pts[V%2]}<br>Their Point: ${g.pts[1-V%2]}<br>Match: ${sc[V%2]} - ${sc[1-V%2]}</div>`;
if(pl&&g.last)h+=`<button class="bt" style="position:absolute;left:10px;top:calc(100px + env(safe-area-inset-top,0px));font-size:12px;padding:2px 8px;z-index:3" onclick="LH=1;render()">Last Hand</button>`;
const tr=g.shown?(g.trump<0?'🃏':card((g.trump<<3)+3,'" style="--w:44px').replace('JQKA','')):'<div class="bk"></div>';
h+=`<div class="table"><div class="r3"><div>They${pile(1-V%2)}</div><div>Trump<div class="bk" style="${g.shown?'background:#fffef8;color:'+(g.trump==1||g.trump==2?'#d0192b':'#111')+';font-size:26px':''}">${g.shown?(g.trump<0?'🃏':SU[g.trump]):''}</div></div><div>We${pile(V%2)}</div></div>`;
h+=g.trick.map(x=>card(x.c,`tc p${(x.s-V+4)%4} ${RU.anim?(g.sw>=0&&g.sw!=null?'sw w'+((g.sw-V+4)%4):(x.c==g.fresh?'fresh':'')):''}`)).join('');
if(me&&pl&&canAsk(V)&&g.asked!=V)h+=`<div class="act"><button class="bt" onclick="ask(${V})">Show Trump</button></div>`;
if(pl&&g.trick.length==4)h+=`<div class="act"><button class="bt" onclick="endTrick()">Skip</button></div>`;
h+='</div>';
[2,1,3].forEach(r=>{const s=(V+r)%4,b=g.bids[s];h+=`<div class="seat s${r}"><div class="tag">${NM[s]}</div><div class="av ${g.turn==s?'on':''}">${FACE(s)}</div><div class="bd">${g.ph=='bid'||g.ph=='trump'?(b>0?b:b<0?'Pass':''):(s==g.bidder?g.target:'')}</div>${g.turn==s&&!D&&g.ph!='ann'&&g.ph!='over'&&!(pl&&g.trick.length==4)?'<div class="bub">Thinking…</div>':''}</div>`});
h+=`<div class="me">${me&&pl?NM[V]+' — Your Turn':''}</div><div class="hand">${g.hands[V].map(c=>card(c,'',`onclick="tap(${c})"`)).join('')}</div>`;
if(g.ph=='bid'&&g.turn==V){h+='<div class="grid">'+[...Array(13)].map((_,i)=>i<12?`<button ${16+i<=g.high?'disabled':''} onclick="doBid(${V},${16+i})">${16+i}</button>`:'').join('').replace(/<\/button>(?=$)/,'</button>')+(forced(V)?'':`<button class="ps" onclick="doBid(${V},0)">Pass</button>`)+'</div>'}
if(g.ph=='trump'&&g.bidder==V){const o=[[3,'2'],[2,'2'],[4,'<small>7th Card</small>7'],[1,'2'],[0,'2'],[5,'<small>Joker</small>🃏']].filter(x=>x[0]!=5||RU.joker).concat(RU.rev?[[6,'<small>Reverse</small>🔄']]:[]);
h+='<div class="tg"><div class="g6">'+o.map(([k,t])=>`<div class="tc6 ${k==1||k==2?'rd':''} ${TS==k?'sel':''}" onclick="TS=${k};render()">${k<4?SU[k]:t}${k<4?'':''}</div>`).join('')+`</div><button class="bt" style="width:100%;margin-top:2px;font-size:22px" onclick="chooseTrump()">Set Trump</button></div>`}
if(g.ph=='ann'){const b=g.bidder;if(g.type=='7th'&&b==V){const c7=g.hands[V].find(c=>c>>3==g.trump)&&null,np=!g.hands[V].some(c=>c>>3==g.trump&&PT[c&7]);h+=dl(`7'th card is<br>${SB[g.trump]}${np?'<br>You have no point<br>of Trump in hand':''}`,[['Play','startPlay()']].concat(RU.seven&&np?[['Reset','newDeal()']]:[]))}
